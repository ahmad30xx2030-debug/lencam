<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <meta name="description" content="تطبيق كشاف ضوئي بأعلى دقة كاميرا مع إمكانية إخفاء الواجهة للشرح">
    <title>كشاف ضوئي | Flashlight</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <!-- Video fills entire background -->
    <video id="cameraFeed" autoplay playsinline muted></video>

    <!-- Overlay UI -->
    <div id="uiOverlay" class="ui-overlay">
        <!-- Top bar -->
        <div class="top-bar">
            <div class="status-badge" id="statusBadge">
                <span class="status-dot"></span>
                <span class="status-text">غير متصل</span>
            </div>
            <div class="top-actions">
                <button class="icon-btn fullscreen-btn" id="fullscreenBtn" title="شاشة كاملة">
                    <svg class="fs-expand" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <polyline points="15 3 21 3 21 9"/>
                        <polyline points="9 21 3 21 3 15"/>
                        <line x1="21" y1="3" x2="14" y2="10"/>
                        <line x1="3" y1="21" x2="10" y2="14"/>
                    </svg>
                    <svg class="fs-compress" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="display:none">
                        <polyline points="4 14 10 14 10 20"/>
                        <polyline points="20 10 14 10 14 4"/>
                        <line x1="14" y1="10" x2="21" y2="3"/>
                        <line x1="3" y1="21" x2="10" y2="14"/>
                    </svg>
                </button>
                <button class="icon-btn hide-btn" id="hideUIBtn" title="إخفاء الواجهة (مسافة)">
                    <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/>
                        <circle cx="12" cy="12" r="3"/>
                        <line x1="1" y1="1" x2="23" y2="23" stroke-width="2.5"/>
                    </svg>
                </button>
            </div>
        </div>

        <!-- Center controls -->
        <div class="center-controls">
            <div class="controls-group">
                <!-- Camera Power Button -->
                <button class="power-btn" id="powerBtn">
                    <div class="power-ring">
                        <svg width="64" height="64" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <path d="M23 19a2 2 0 0 1-2 2H3a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h4l2-3h6l2 3h4a2 2 0 0 1 2 2z"/>
                            <circle cx="12" cy="13" r="4"/>
                        </svg>
                    </div>
                    <span class="power-label">تشغيل الكاميرا</span>
                </button>

                <!-- Torch Toggle Button -->
                <button class="torch-btn" id="torchBtn" disabled>
                    <div class="torch-ring">
                        <svg width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <polygon points="13 2 3 14 12 14 11 22 21 10 12 10 13 2"/>
                        </svg>
                    </div>
                    <span class="torch-label">تشغيل الفلاش</span>
                </button>
            </div>
        </div>

        <!-- Bottom bar -->
        <div class="bottom-bar">
            <div class="info-row">
                <div class="info-chip" id="resolutionChip">
                    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="2" y="3" width="20" height="14" rx="2"/><line x1="8" y1="21" x2="16" y2="21"/><line x1="12" y1="17" x2="12" y2="21"/></svg>
                    <span id="resolutionText">--</span>
                </div>
                <div class="info-chip" id="cameraChip">
                    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M23 19a2 2 0 0 1-2 2H3a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h4l2-3h6l2 3h4a2 2 0 0 1 2 2z"/><circle cx="12" cy="13" r="4"/></svg>
                    <span id="cameraText">الكاميرا الخلفية</span>
                </div>
            </div>
            <p class="hint-text" id="hintText">اضغط <kbd>مسافة</kbd> لإخفاء/إظهار الواجهة</p>
        </div>
    </div>

    <!-- Restore button (shown when UI is hidden) -->
    <button class="restore-btn" id="restoreBtn" title="إظهار الواجهة (مسافة)">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/>
            <circle cx="12" cy="12" r="3"/>
        </svg>
    </button>

    <!-- Error/Permission modal -->
    <div class="modal-overlay" id="errorModal">
        <div class="modal-card">
            <div class="modal-icon error">
                <svg width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><line x1="15" y1="9" x2="9" y2="15"/><line x1="9" y1="9" x2="15" y2="15"/></svg>
            </div>
            <h2 id="errorTitle">خطأ</h2>
            <p id="errorMessage">حدث خطأ غير متوقع</p>
            <button class="modal-btn" id="errorRetryBtn">إعادة المحاولة</button>
        </div>
    </div>

    <script src="app.js"></script>
</body>
</html>
